appId: com.blueberry
productName: Blueberry
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - node_modules/sql.js/**/*
publish:
  provider: github
  owner: qinzheng93
  repo: Blueberry
  releaseType: release
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Blueberry
linux:
  target:
    - AppImage
  category: Utility
